<!doctype html><html lang=ja><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発注アプリ v3.6.2 (Fixed & Cam)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#8b8a84;
--bd:rgba(11,11,11,.12);--grid:#e6e5df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#c9a227;--crit:#d64545}
:root[data-theme=dark]{color-scheme:dark;--bg:#111110;--card:#1e1e1d;--ink:#f2f2ee;--ink2:#c3c2b7;
--muted:#8b8a84;--bd:rgba(255,255,255,.14);--grid:#2f2f2c;--s1:#3987e5;--s2:#e8703f;--s3:#1fbd84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;
padding:0 0 95px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd)}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1100px;margin:0 auto}
.hbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;
border:1px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer;min-width:68px}
.tab .ic{font-size:20px;line-height:1.1}
.tab .nm{font-size:11px;color:var(--ink2);white-space:nowrap}
.tab .ct{font-size:9.5px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--s1);border-color:var(--s1)}
.tab[aria-selected=true] .nm,.tab[aria-selected=true] .ct{color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{display:inline-flex;width:21px;height:21px;border-radius:7px;background:var(--s1);color:#fff;
font-size:12px;align-items:center;justify-content:center;flex:0 0 auto}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--bd);
border-radius:9px;background:var(--bg);color:var(--ink)}
input[type=number]{text-align:right}
.fg{display:grid;gap:10px;margin-bottom:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
button,.btn-label{font:inherit;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--s1);
background:var(--s1);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
white-space:nowrap}
button.gh,.btn-label.gh{background:var(--card);color:var(--ink2);border-color:var(--bd);font-weight:500}
button.sm,.btn-label.sm{padding:6px 8px;font-size:12px}
button.cloud{background:#0f9d58;border-color:#0f9d58;color:#fff}
button[aria-pressed=true]{background:var(--s1);color:#fff;border-color:var(--s1)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.modes{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-bottom:10px}
.modes button{border:0;border-radius:0;background:var(--card);color:var(--ink2);font-weight:500;padding:8px 13px}
.modes button[aria-pressed=true]{background:var(--s1);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}
th.l{text-align:left}
td{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
td.l{text-align:left;font-variant-numeric:normal}
#itb input{width:52px;padding:7px 4px;text-align:center;font-size:16px;border-radius:7px;transition:border-color .2s,background .2s}
.nm1{font-size:13.5px;font-weight:600;line-height:1.3}
.nm2{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.gr{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;
font-size:11px;text-align:center;font-weight:700}
.g4c{background:var(--s3)}.g3c{background:var(--s1)}.g2c{background:var(--s4)}.g1c{background:var(--s2)}.gnc{background:#8b5cf6}
.tot{font-weight:700;font-size:16px}
tr.sum td{font-weight:700;background:var(--bg);border-top:2px solid var(--bd);font-size:15px;padding:8px 4px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{padding:2px 7px;font-size:12px;line-height:1.3;border-radius:5px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.ok{color:var(--s3);font-weight:600}.warn{color:var(--s2);font-weight:600}.crit{color:var(--crit);font-weight:700}
.row-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--grid)}
.row .k{color:var(--muted);flex:0 0 88px;font-size:12px}
.row .v{font-weight:600;flex:1 1 140px;min-width:0;word-break:break-word;font-size:13px}
textarea{width:100%;height:130px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);
padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:40;max-width:1100px;margin:0 auto}
.foot button{flex:1 1 auto;min-width:0}
.st{flex:0 0 70px;font-size:10px;color:var(--s3);font-weight:600;display:flex;align-items:center;
justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:1px solid var(--bd);border-radius:15px;background:var(--card);color:var(--ink);
padding:16px;max-width:480px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--s2);color:#fff;font-weight:700}
</style></head><body>

<header>
<div class=hbar>
<h1 id=title>発注アプリ</h1>
<button class="gh sm" onclick="toggleTheme()">◐</button>
<button class="gh sm" onclick="dlg('dSet')">設定</button>
</div>
<div class=tabs id=tabs></div>
</header>

<div class=wrap>

<div class=top-grid style="margin-top:12px">
<div class=card style="border:2px solid var(--s1)">
<h2><span class=n>0</span>今日のセットアップ</h2>
<div class=fg style="grid-template-columns:1fr 1fr">
<div><label>納品日</label><input id=dt placeholder="8/21"></div>
<div><label>今朝の棚</label><input id=carry type=number placeholder="数えた数"></div>
</div>
<div id=setup class=row-grid></div>
</div>

<div class=card>
<h2><span class=n>1</span>目標配分</h2>
<div class="fg g2">
<div><label>目標 個数</label><input id=tq type=number></div>
<div><label>金額(税抜)</label><input id=ta type=number></div>
</div>
<div class="fg g4">
<div><label>1便%</label><input id=r1 type=number></div>
<div><label>2便%</label><input id=r2 type=number></div>
<div><label>3便%</label><input id=r3 type=number></div>
<div style="display:flex;align-items:flex-end"><button style="width:100%" onclick="alloc()">配分</button></div>
</div>
<p class=note id=allocnote></p>
</div>
</div>

<div class=card>
<h2><span class=n>2</span>商品別入力</h2>
<div class=modes>
<button id=m_o aria-pressed=true onclick="setMode('o')">発注</button>
<button id=m_i aria-pressed=false onclick="setMode('i')">AI推奨</button>
<button id=m_a aria-pressed=false onclick="setMode('a')">実績</button>
</div>
<div class=btns>
<button class="gh sm" id=sortb onclick="toggleSort()">並べ替え</button>
<button class="gh sm" onclick="fillFrom('i')">AIをコピー</button>
<button class="gh sm" onclick="clearMode()">クリア</button>
<button class="gh sm" onclick="editItem(null)">＋商品</button>
</div>
<div style="overflow-x:auto"><table><thead id=ith></thead><tbody id=itb></tbody></table></div>
</div>

<div class=card>
<h2><span class=n>3</span>履歴・連携・カメラ</h2>
<div class=btns><button class="gh sm" onclick="openHist()">＋実績記録</button>
<button class=sm onclick="outPrompt()">AI分析</button>
<button class="gh sm" onclick="outFull()">バックアップ</button>
<button class="gh sm" onclick="dlg('dImp')">読込</button>
<label class="btn-label gh sm">📷 写真読取
<input type=file accept="image/*" capture="environment" style="display:none" onchange="handleImage(this)">
</label>
</div>
<textarea id=out readonly></textarea>
</div>
</div>

<div class=foot>
<button class="cloud sm" onclick="cloudSave()">☁️保存</button>
<button class="gh sm" onclick="cloudLoad()">☁️読込</button>
<button class="gh sm" onclick="save()">端末保存</button>
<div class=st id=st></div>
</div>

<dialog id=dItem><h2 id=itTitle>商品</h2>
<div class="fg"><div><label>商品名</label><input id=f_name></div></div>
<div class="fg g3">
<div><label>売価</label><input id=f_price type=number></div>
<div><label>日販</label><input id=f_day type=number step=0.1></div>
<div><label>単位</label><select id=f_unit><option value=1>1個</option><option value=2>2個</option></select></div>
</div>
<div class="fg g3">
<div><label>適性</label><select id=f_grade><option>◎</option><option>○</option><option>△</option><option>×</option><option>新</option></select></div>
<div><label>目安</label><input id=f_my type=number></div>
<div><label>印</label><input id=f_tag></div>
</div>
<div class=btns style="margin-top:10px">
<button onclick="saveItem()">保存</button>
<button class=gh onclick="document.getElementById('dItem').close()">閉じる</button></div></dialog>

<dialog id=dHist><h2>実績記録</h2>
<div class="fg g2">
<div><label>日付</label><input id=h_d></div>
<div><label>天候</label><input id=h_w></div></div>
<div class="fg g4">
<div><label>AI</label><input id=h_ai type=number></div>
<div><label>納品</label><input id=h_n type=number></div>
<div><label>販売</label><input id=h_s type=number></div>
<div><label>廃棄</label><input id=h_ha type=number></div></div>
<div class=btns style="margin-top:10px"><button onclick="saveHist()">記録</button>
<button class=gh onclick="document.getElementById('dHist').close()">閉じる</button></div></dialog>

<dialog id=dSet><h2>設定</h2>
<div class="fg"><div><label>GAS URL</label><input id=gas_url></div></div>
<div class=btns><button class=sm onclick="saveGasUrl()">URL保存</button></div>
<div id=setbody></div>
<div class=btns style="margin-top:12px"><button class=gh onclick="document.getElementById('dSet').close()">閉じる</button></div></dialog>

<dialog id=dImp><h2>読み込み</h2>
<textarea id=impbox></textarea>
<div class=btns style="margin-top:10px"><button onclick="doImport()">読み込む</button>
<button class=gh onclick="document.getElementById('dImp').close()">閉じる</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const KEY='hacchu.db.v3', GAS_KEY='hacchu.gas.url';
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxtaQ-NAYOwLHK418teJrMXqC9W2THI4qXTf-0iWXQ24oNZBKTglLNZvKU-HloUDGe6/exec';
const GEN=[['onigiri','おむすび','🍙'],['sushi','寿司','🍣'],['bento','弁当','🍱'],['chilled','チルド弁当','🧊'],
['pasta','パスタ','🍝'],['hiyashi','冷やし麺','🍧'],['hotmen','ホット麺','🍜'],['yakimen','焼麺','🍳'],
['salad','サラダ','🥗'],['sand','サンドイッチ','🥪'],['sozai','惣菜','🍢'],['other','その他','📦']];
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));

let DB=null, MODE='o', SORT=false, EDIT=null;

function load(){try{const r=localStorage.getItem(KEY);if(r){DB=JSON.parse(b64d(r));return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,b64e(JSON.stringify(DB)));$('st').textContent=hm()}catch(e){}}
function hm(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function flash(t){$('st').textContent=t;setTimeout(()=>$('st').textContent=hm(),2000)}
const autosave=()=>{clearTimeout(window.sT);window.sT=setTimeout(save,400)};
const G=()=>DB.g[DB.active];
function dlg(id){if(id==='dSet')renderSet();$(id).showModal()}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')}

function getGasUrl(){return localStorage.getItem(GAS_KEY)||DEFAULT_GAS_URL}
function saveGasUrl(){localStorage.setItem(GAS_KEY,$('gas_url').value.trim());alert('URL保存完了')}

async function cloudSave(){
  const url=getGasUrl();
  $('st').textContent='保存中...';
  try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(DB)});
    flash('完了')}catch(e){flash('失敗')}}

function cloudLoad(){
  const url=getGasUrl(), cb='cb'+Date.now();
  $('st').textContent='読込中...';
  window[cb]=(d)=>{if(d&&d.g){DB=d;save();renderAll();flash('完了')}else{flash('なし')}};
  const s=document.createElement('script');s.src=url+'?callback='+cb;
  document.body.appendChild(s);setTimeout(()=>{if(window[cb])flash('失敗')},5000)}

async function handleImage(input){
  if(!input.files||!input.files[0])return;
  $('st').textContent='解析中...';
  const {data:{text}}=await Tesseract.recognize(input.files[0],'jpn+eng');
  $('out').value=text;
  flash('解析完了');
}

function renderAll(){renderTabs();renderItems();renderHist();renderSetup()}
function renderTabs(){const el=$('tabs');el.textContent='';
  GEN.forEach(([k,n,ic])=>{const b=document.createElement('button');b.className='tab';
    b.setAttribute('aria-selected',String(k===DB.active));b.onclick=()=>{DB.active=k;renderAll()};
    b.innerHTML=`<div class=ic>${ic}</div><div class=nm>${n}</div>`;el.appendChild(b)})}
function renderItems(){const B=$('itb');B.textContent='';
  G().items.forEach((r,ix)=>{const tr=document.createElement('tr');
    tr.innerHTML=`<td class=l><div class=nm1>${r.name}</div><div class=nm2>¥${r.price} 日販${r.day}</div></td>
    <td><span class=gr>${r.grade}</span></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[0]||''}" onchange="setV('${r.id}',0,this.value)"></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[1]||''}" onchange="setV('${r.id}',1,this.value)"></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[2]||''}" onchange="setV('${r.id}',2,this.value)"></td>
    <td class=tot>${G().cur.v[r.id]?.[MODE]?.reduce((a,c)=>a+(+c||0),0)||''}</td>`;
    B.appendChild(tr)});
}
function setV(id,i,v){G().cur.v[id]=G().cur.v[id]||{o:[null,null,null],i:[null,null,null],a:[null,null,null]};
  G().cur.v[id][MODE][i]=+v||null;save();renderItems()}
function renderHist(){} 
function renderSetup(){}
function renderSet(){$('gas_url').value=getGasUrl()}

if(!load())DB=fresh();
function fresh(){const g={};GEN.forEach(([k,n,i])=>{g[k]={name:n,items:[],hist:[],cur:{v:{}}};});return{v:3,active:'onigiri',g}}
renderAll();
</script></body></html>

.nm2{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.gr{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;
font-size:11px;text-align:center;font-weight:700}
.g4c{background:var(--s3)}.g3c{background:var(--s1)}.g2c{background:var(--s4)}.g1c{background:var(--s2)}.gnc{background:#8b5cf6}
.tot{font-weight:700;font-size:16px}
tr.sum td{font-weight:700;background:var(--bg);border-top:2px solid var(--bd);font-size:15px;padding:8px 4px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{padding:2px 7px;font-size:12px;line-height:1.3;border-radius:5px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.ok{color:var(--s3);font-weight:600}.warn{color:var(--s2);font-weight:600}.crit{color:var(--crit);font-weight:700}
.row-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--grid)}
.row .k{color:var(--muted);flex:0 0 88px;font-size:12px}
.row .v{font-weight:600;flex:1 1 140px;min-width:0;word-break:break-word;font-size:13px}
textarea{width:100%;height:130px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);
padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:40;max-width:1100px;margin:0 auto}
.foot button{flex:1 1 auto;min-width:0}
.st{flex:0 0 70px;font-size:10px;color:var(--s3);font-weight:600;display:flex;align-items:center;
justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:1px solid var(--bd);border-radius:15px;background:var(--card);color:var(--ink);
padding:16px;max-width:480px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--s2);color:#fff;font-weight:700}
</style></head><body>

<header>
<div class=hbar>
<h1 id=title>発注アプリ</h1>
<button class="gh sm" onclick="toggleTheme()">◐</button>
<button class="gh sm" onclick="dlg('dSet')">設定</button>
</div>
<div class=tabs id=tabs></div>
</header>

<div class=wrap>

<div class=top-grid style="margin-top:12px">
<div class=card style="border:2px solid var(--s1)">
<h2><span class=n>0</span>今日のセットアップ</h2>
<div class=fg style="grid-template-columns:1fr 1fr">
<div><label>納品日</label><input id=dt placeholder="8/21"></div>
<div><label>今朝の棚</label><input id=carry type=number placeholder="数えた数"></div>
</div>
<div id=setup class=row-grid></div>
</div>

<div class=card>
<h2><span class=n>1</span>目標配分</h2>
<div class="fg g2">
<div><label>目標 個数</label><input id=tq type=number></div>
<div><label>金額(税抜)</label><input id=ta type=number></div>
</div>
<div class="fg g4">
<div><label>1便%</label><input id=r1 type=number></div>
<div><label>2便%</label><input id=r2 type=number></div>
<div><label>3便%</label><input id=r3 type=number></div>
<div style="display:flex;align-items:flex-end"><button style="width:100%" onclick="alloc()">配分</button></div>
</div>
<p class=note id=allocnote></p>
</div>
</div>

<div class=card>
<h2><span class=n>2</span>商品別入力</h2>
<div class=modes>
<button id=m_o aria-pressed=true onclick="setMode('o')">発注</button>
<button id=m_i aria-pressed=false onclick="setMode('i')">AI推奨</button>
<button id=m_a aria-pressed=false onclick="setMode('a')">実績</button>
</div>
<div class=btns>
<button class="gh sm" id=sortb onclick="toggleSort()">並べ替え</button>
<button class="gh sm" onclick="fillFrom('i')">AIをコピー</button>
<button class="gh sm" onclick="clearMode()">クリア</button>
<button class="gh sm" onclick="editItem(null)">＋商品</button>
</div>
<div style="overflow-x:auto"><table><thead id=ith></thead><tbody id=itb></tbody></table></div>
</div>

<div class=card>
<h2><span class=n>3</span>履歴・連携・カメラ</h2>
<div class=btns><button class="gh sm" onclick="openHist()">＋実績記録</button>
<button class=sm onclick="outPrompt()">AI分析</button>
<button class="gh sm" onclick="outFull()">バックアップ</button>
<button class="gh sm" onclick="dlg('dImp')">読込</button>
<label class="btn-label gh sm">📷 写真読取
<input type=file accept="image/*" capture="environment" style="display:none" onchange="handleImage(this)">
</label>
</div>
<textarea id=out readonly></textarea>
</div>
</div>

<div class=foot>
<button class="cloud sm" onclick="cloudSave()">☁️保存</button>
<button class="gh sm" onclick="cloudLoad()">☁️読込</button>
<button class="gh sm" onclick="save()">端末保存</button>
<div class=st id=st></div>
</div>

<dialog id=dItem><h2 id=itTitle>商品</h2>
<div class="fg"><div><label>商品名</label><input id=f_name></div></div>
<div class="fg g3">
<div><label>売価</label><input id=f_price type=number></div>
<div><label>日販</label><input id=f_day type=number step=0.1></div>
<div><label>単位</label><select id=f_unit><option value=1>1個</option><option value=2>2個</option></select></div>
</div>
<div class="fg g3">
<div><label>適性</label><select id=f_grade><option>◎</option><option>○</option><option>△</option><option>×</option><option>新</option></select></div>
<div><label>目安</label><input id=f_my type=number></div>
<div><label>印</label><input id=f_tag></div>
</div>
<div class=btns style="margin-top:10px">
<button onclick="saveItem()">保存</button>
<button class=gh onclick="document.getElementById('dItem').close()">閉じる</button></div></dialog>

<dialog id=dHist><h2>実績記録</h2>
<div class="fg g2">
<div><label>日付</label><input id=h_d></div>
<div><label>天候</label><input id=h_w></div></div>
<div class="fg g4">
<div><label>AI</label><input id=h_ai type=number></div>
<div><label>納品</label><input id=h_n type=number></div>
<div><label>販売</label><input id=h_s type=number></div>
<div><label>廃棄</label><input id=h_ha type=number></div></div>
<div class=btns style="margin-top:10px"><button onclick="saveHist()">記録</button>
<button class=gh onclick="document.getElementById('dHist').close()">閉じる</button></div></dialog>

<dialog id=dSet><h2>設定</h2>
<div class="fg"><div><label>GAS URL</label><input id=gas_url></div></div>
<div class=btns><button class=sm onclick="saveGasUrl()">URL保存</button></div>
<div id=setbody></div>
<div class=btns style="margin-top:12px"><button class=gh onclick="document.getElementById('dSet').close()">閉じる</button></div></dialog>

<dialog id=dImp><h2>読み込み</h2>
<textarea id=impbox></textarea>
<div class=btns style="margin-top:10px"><button onclick="doImport()">読み込む</button>
<button class=gh onclick="document.getElementById('dImp').close()">閉じる</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const KEY='hacchu.db.v3', GAS_KEY='hacchu.gas.url';
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxtaQ-NAYOwLHK418teJrMXqC9W2THI4qXTf-0iWXQ24oNZBKTglLNZvKU-HloUDGe6/exec';
const GEN=[['onigiri','おむすび','🍙'],['sushi','寿司','🍣'],['bento','弁当','🍱'],['chilled','チルド弁当','🧊'],
['pasta','パスタ','🍝'],['hiyashi','冷やし麺','🍧'],['hotmen','ホット麺','🍜'],['yakimen','焼麺','🍳'],
['salad','サラダ','🥗'],['sand','サンドイッチ','🥪'],['sozai','惣菜','🍢'],['other','その他','📦']];
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));

let DB=null, MODE='o', SORT=false, EDIT=null;

function load(){try{const r=localStorage.getItem(KEY);if(r){DB=JSON.parse(b64d(r));return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,b64e(JSON.stringify(DB)));$('st').textContent=hm()}catch(e){}}
function hm(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function flash(t){$('st').textContent=t;setTimeout(()=>$('st').textContent=hm(),2000)}
const autosave=()=>{clearTimeout(window.sT);window.sT=setTimeout(save,400)};
const G=()=>DB.g[DB.active];
function dlg(id){if(id==='dSet')renderSet();$(id).showModal()}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')}

function getGasUrl(){return localStorage.getItem(GAS_KEY)||DEFAULT_GAS_URL}
function saveGasUrl(){localStorage.setItem(GAS_KEY,$('gas_url').value.trim());alert('URL保存完了')}

async function cloudSave(){
  const url=getGasUrl();
  $('st').textContent='保存中...';
  try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(DB)});
    flash('完了')}catch(e){flash('失敗')}}

function cloudLoad(){
  const url=getGasUrl(), cb='cb'+Date.now();
  $('st').textContent='読込中...';
  window[cb]=(d)=>{if(d&&d.g){DB=d;save();renderAll();flash('完了')}else{flash('なし')}};
  const s=document.createElement('script');s.src=url+'?callback='+cb;
  document.body.appendChild(s);setTimeout(()=>{if(window[cb])flash('失敗')},5000)}

async function handleImage(input){
  if(!input.files||!input.files[0])return;
  $('st').textContent='解析中...';
  const {data:{text}}=await Tesseract.recognize(input.files[0],'jpn+eng');
  $('out').value=text;
  flash('解析完了');
}

function renderAll(){renderTabs();renderItems();renderHist();renderSetup()}
function renderTabs(){const el=$('tabs');el.textContent='';
  GEN.forEach(([k,n,ic])=>{const b=document.createElement('button');b.className='tab';
    b.setAttribute('aria-selected',String(k===DB.active));b.onclick=()=>{DB.active=k;renderAll()};
    b.innerHTML=`<div class=ic>${ic}</div><div class=nm>${n}</div>`;el.appendChild(b)})}
function renderItems(){const B=$('itb');B.textContent='';
  G().items.forEach((r,ix)=>{const tr=document.createElement('tr');
    tr.innerHTML=`<td class=l><div class=nm1>${r.name}</div><div class=nm2>¥${r.price} 日販${r.day}</div></td>
    <td><span class=gr>${r.grade}</span></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[0]||''}" onchange="setV('${r.id}',0,this.value)"></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[1]||''}" onchange="setV('${r.id}',1,this.value)"></td>
    <td><input type=number value="${G().cur.v[r.id]?.[MODE]?.[2]||''}" onchange="setV('${r.id}',2,this.value)"></td>
    <td class=tot>${G().cur.v[r.id]?.[MODE]?.reduce((a,c)=>a+(+c||0),0)||''}</td>`;
    B.appendChild(tr)});
}
function setV(id,i,v){G().cur.v[id]=G().cur.v[id]||{o:[null,null,null],i:[null,null,null],a:[null,null,null]};
  G().cur.v[id][MODE][i]=+v||null;save();renderItems()}
function renderHist(){} 
function renderSetup(){}
function renderSet(){$('gas_url').value=getGasUrl()}

if(!load())DB=fresh();
function fresh(){const g={};GEN.forEach(([k,n,i])=>{g[k]={name:n,items:[],hist:[],cur:{v:{}}};});return{v:3,active:'onigiri',g}}
renderAll();
</script></body></html>
