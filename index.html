<!doctype html><html lang=ja><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発注アプリ v3.6.6 (Stable)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--muted:#8b8a84;
--bd:rgba(11,11,11,.12);--grid:#e6e5df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#c9a227;--crit:#d64545}
:root[data-theme=dark]{color-scheme:dark;--bg:#111110;--card:#1e1e1d;--ink:#f2f2ee;--ink2:#c3c2b7;
--muted:#8b8a84;--bd:rgba(255,255,255,.14);--grid:#2f2f2c;--s1:#3987e5;--s2:#e8703f;--s3:#1fbd84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;
padding:0 0 95px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd)}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1100px;margin:0 auto}
.hbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;
border:1px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer;min-width:68px}
.tab .ic{font-size:20px;line-height:1.1}
.tab .nm{font-size:11px;color:var(--ink2);white-space:nowrap}
.tab .ct{font-size:9.5px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--s1);border-color:var(--s1)}
.tab[aria-selected=true] .nm,.tab[aria-selected=true] .ct{color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{display:inline-flex;width:21px;height:21px;border-radius:7px;background:var(--s1);color:#fff;
font-size:12px;align-items:center;justify-content:center;flex:0 0 auto}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--bd);
border-radius:9px;background:var(--bg);color:var(--ink)}
input[type=number]{text-align:right}
.fg{display:grid;gap:10px;margin-bottom:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
button,.btn-label{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--s1);
background:var(--s1);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button.gh,.btn-label.gh{background:var(--card);color:var(--ink2);border-color:var(--bd);font-weight:500}
button.sm,.btn-label.sm{padding:6px 11px;font-size:12.5px}
button.cloud{background:#0f9d58;border-color:#0f9d58;color:#fff}
button[aria-pressed=true]{background:var(--s1);color:#fff;border-color:var(--s1)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.modes{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-bottom:10px}
.modes button{border:0;border-radius:0;background:var(--card);color:var(--ink2);font-weight:500;padding:8px 13px}
.modes button[aria-pressed=true]{background:var(--s1);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}
th.l{text-align:left}
td{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
td.l{text-align:left;font-variant-numeric:normal}
#itb input{width:52px;padding:7px 4px;text-align:center;font-size:16px;border-radius:7px;transition:border-color .2s,background .2s}
#itb input.bad-unit{border-color:var(--crit);background:rgba(214,69,69,.12);color:var(--crit);font-weight:700}
.nm1{font-size:13.5px;font-weight:600;line-height:1.3}
.nm2{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.my{font-size:11px;font-weight:700;color:var(--s1);margin-top:1px}
.gr{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;color:#fff;
font-size:11px;text-align:center;font-weight:700}
.g4c{background:var(--s3)}.g3c{background:var(--s1)}.g2c{background:var(--s4)}.g1c{background:var(--s2)}.gnc{background:#8b5cf6}
.tot{font-weight:700;font-size:16px}
tr.sum td{font-weight:700;background:var(--bg);border-top:2px solid var(--bd);font-size:15px;padding:8px 4px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{padding:2px 7px;font-size:12px;line-height:1.3;border-radius:5px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.ok{color:var(--s3);font-weight:600}.warn{color:var(--s2);font-weight:600}.crit{color:var(--crit);font-weight:700}
.row-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;padding:5px 0;border-bottom:1px solid var(--grid)}
.row .k{color:var(--muted);flex:0 0 88px;font-size:12px}
.row .v{font-weight:600;flex:1 1 140px;min-width:0;word-break:break-word;font-size:13px}
textarea{width:100%;height:130px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;
padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--ink)}

/* ★ ボタンのカタカタ防止用 CSS（幅固定） */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);
padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:40;max-width:1100px;margin:0 auto;align-items:center}
.foot button{flex:1; white-space:nowrap; padding:8px 4px; font-size:12.5px; min-width:0}
.st{width:85px; flex-shrink:0; font-size:11px; color:var(--s3); font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* ★ ここまで */

dialog{border:1px solid var(--bd);border-radius:15px;background:var(--card);color:var(--ink);
padding:16px;max-width:480px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--s2);color:#fff;font-weight:700}
.pill-warn{background:var(--crit);animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}

@media (min-width: 768px) {
  .wrap{padding:0 20px}
  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .top-grid .card{margin:0}
  #itb input{width:56px;padding:8px 6px;font-size:17px}
  .nm1{font-size:14.5px}
  .nm2{font-size:11.5px}
  th{font-size:12px;padding:8px 6px}
  td{padding:8px 6px}
}
</style></head><body>

<header>
<div class=hbar>
<h1 id=title>発注アプリ</h1>
<button class="gh sm" onclick="toggleTheme()">◐</button>
<button class="gh sm" onclick="dlg('dSet')">設定</button>
</div>
<div class=tabs id=tabs></div>
</header>

<div class=wrap>

<div class=top-grid style="margin-top:12px">
<div class=card style="border:2px solid var(--s1)">
<h2><span class=n>0</span>今日のセットアップ</h2>
<div class=fg style="grid-template-columns:1fr 1fr">
<div><label>納品日</label><input id=dt placeholder="8/21"></div>
<div><label>今朝の棚 総数（繰越＋1便）</label><input id=carry type=number placeholder="数えた数"></div>
</div>
<div id=setup class=row-grid></div>
<p class=note id=setupmsg></p>
</div>

<div class=card>
<h2><span class=n>1</span>目標から自動配分（上位50%傾斜）</h2>
<div class="fg g2">
<div><label>目標 個数</label><input id=tq type=number placeholder="個"></div>
<div><label>目標 納品金額（税抜）</label><input id=ta type=number placeholder="円"></div>
</div>
<div class="fg g4">
<div><label>1便%</label><input id=r1 type=number></div>
<div><label>2便%</label><input id=r2 type=number></div>
<div><label>3便%</label><input id=r3 type=number></div>
<div style="display:flex;align-items:flex-end"><button style="width:100%" onclick="alloc()">配分</button></div>
</div>
<p class=note id=allocnote></p>
</div>
</div>

<div class=card>
<h2><span class=n>2</span>商品別入力</h2>
<div class=modes>
<button id=m_o aria-pressed=true onclick="setMode('o')">発注</button>
<button id=m_i aria-pressed=false onclick="setMode('i')">AI推奨</button>
<button id=m_a aria-pressed=false onclick="setMode('a')">実績</button>
</div>
<div class=btns>
<button class="gh sm" id=sortb onclick="toggleSort()">並べ替え：OFF</button>
<button class="gh sm" onclick="fillFrom('i')">AI推奨をコピー</button>
<button class="gh sm" onclick="clearMode()">この列を消す</button>
<button class="gh sm" onclick="editItem(null)">＋商品</button>
</div>
<div style="overflow-x:auto"><table><thead id=ith></thead><tbody id=itb></tbody></table></div>
</div>

<div class=card>
<h2><span class=n>3</span>履歴</h2>
<div class=btns><button class="gh sm" onclick="openHist()">＋今日の実績を記録</button></div>
<div style="overflow-x:auto"><table><thead><tr><th class=l>日</th><th>AI</th><th>納品</th><th>販売</th><th>廃棄</th><th>消化率</th><th>便別納品</th><th></th></tr></thead><tbody id=htb></tbody></table></div>
</div>

<div class=card>
<h2><span class=n>4</span>書き出し・AI連携・カメラ取込</h2>
<div class=btns>
<button class=sm onclick="outPrompt()">AI分析用プロンプト</button>
<button class="gh sm" onclick="outCompact()">AIに送る（短い）</button>
<button class="gh sm" onclick="outFull()">バックアップ</button>
<button class="gh sm" onclick="copyOut()">コピー</button>
<button class="gh sm" onclick="saveFile()">ファイル保存</button>
<button class="gh sm" onclick="dlg('dImp')">読み込み</button>
<label class="btn-label gh sm">
📷 写真読取<input type=file accept="image/*" capture="environment" style="display:none" onchange="handleImage(this)">
</label>
</div>
<textarea id=out readonly></textarea>
<p class=note>「📷 写真読取」で帳票や画面を撮影すると自動で文字解析されます。その文字をAIチャットに貼るとデータ化できます。</p>
</div>

</div>

<div class=foot>
<button class="cloud sm" onclick="cloudSave()">☁️ クラウド保存</button>
<button class="gh sm" onclick="cloudLoad()">☁️ クラウド読込</button>
<button class="sm" onclick="save();flash('端末に保存しました')">端末保存</button>
<div class=st id=st></div>
</div>

<dialog id=dItem><h2 id=itTitle>商品</h2>
<div class="fg"><div><label>商品名</label><input id=f_name></div></div>
<div class="fg g3">
<div><label>売価(税抜)</label><input id=f_price type=number></div>
<div><label>日販</label><input id=f_day type=number step=0.1></div>
<div><label>発注単位</label><select id=f_unit><option value=1>1個から</option><option value=2>2個から</option></select></div>
</div>
<div class="fg g3">
<div><label>適性</label><select id=f_grade><option>◎</option><option>○</option><option>△</option><option>×</option><option>新</option></select></div>
<div><label>本部目安</label><input id=f_my type=number></div>
<div><label>印</label><input id=f_tag placeholder="新/取消"></div>
</div>
<div class="fg"><div><label>メモ</label><input id=f_memo></div></div>
<div class=btns style="margin-top:10px">
<button onclick="saveItem()">保存</button>
<button class=gh onclick="document.getElementById('dItem').close()">閉じる</button>
<button class=gh style="color:var(--crit)" onclick="delItem()">削除</button></div></dialog>

<div><label>天候</label><input id=h_w placeholder="曇のち雨"></div></div>
<div class="fg g4">

<div><label>1便納品</label><input id=h_n1 type=number></div>

<div class=btns style="margin-top:10px"><button onclick="saveHist()">記録</button>

function cloudLoad(){
  const url=getGasUrl();
  if(!url){alert('先に「設定」からGASウェブアプリURLを登録してください');dlg('dSet');return}
  $('st').textContent='読込中...';
  
  const cbName = 'gasCallback_' + Date.now();
  window[cbName] = function(data){
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    if(data && data.g){
      DB = data;
      save();
      renderAll();
      flash('☁️ クラウド読込完了');
    }else{
      alert('Googleドライブに有効なデータがありませんでした');
      flash('読込完了(空)');
    }
  };
  
  const script = document.createElement('script');
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName + '&t=' + Date.now();
  script.onerror = function(){
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
    alert('クラウド読込に失敗しました。GASのデプロイ設定をご確認ください。');
    flash('読込失敗');
  };
  document.body.appendChild(script);
}

/* ---------- 曜日・マニュアル公式学習 ---------- */
function dowOf(t){t=(t||'').trim();let m=t.match(/[（(]?([月火水木金土日])[）)]?/);if(m)return m[1];
  m=t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
  if(m){
    const now=new Date(),curM=now.getMonth()+1,inM=+m[1];
    let y=now.getFullYear();
    if(curM>=11&&inM<=2)y++;
    return '日月火水木金土'[new Date(y,inM-1,+m[2]).getDay()]}
  return null}
function learnDow(){const g=G(),by={},all=[];
  g.hist.forEach(h=>{const d=dowOf(h.d);if(!d||h.s==null)return;(by[d]=by[d]||[]).push(h.s);all.push(h.s)});
  if(all.length<7)return null;
  const avg=all.reduce((a,b)=>a+b,0)/all.length,out={},cnt={};
  Object.keys(by).forEach(d=>{if(by[d].length>=2){out[d]=+(by[d].reduce((a,b)=>a+b,0)/by[d].length/avg).toFixed(3);cnt[d]=by[d].length}});
  return Object.keys(out).length>=4?{f:out,cnt}:null}
function dowInfo(){const d=dowOf($('dt').value);if(!d)return null;
  const L=learnDow(),g=G();
  const f=(L&&L.f[d])||g.dow[d]||1, src=(L&&L.f[d])?('自店'+L.cnt[d]+'日から学習'):'初期値';
  const r=d==='土'?g.rat.sat:d==='日'?g.rat.sun:g.rat.weekday;
  return{d,f,r,src,type:d==='土'?'土曜型':d==='日'?'日曜型':'平日型'}}
function demand(){
  const g=G(),i=dowInfo();if(!i)return null;
  let b=Number(g.base)||0; if(!b)return null;
  let up=Number(g.up)||1;
  if(DB.active==='chilled'&&i.d==='月'){up*=1.5}
  return{q:Math.round(b*i.f*up),
    src:`週平均${b}個 × ${i.d}曜${i.f.toFixed(2)}`+(up!==1?` × 倍率${up.toFixed(2)}`:'')}}
function applyDow(){const i=dowInfo();if(!i)return null;
  $('r1').value=i.r[0];$('r2').value=i.r[1];$('r3').value=i.r[2];return i}
function tgtKey(){const m=($('dt').value||'').match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);return m?(+m[1]+'/'+ +m[2]):null}

/* ---------- 集計・AI採用率 ---------- */
const vv=(id,m)=>{const o=G().cur.v[id];return (o&&o[m])||[null,null,null]};
function setV(id,m,i,x){const c=G().cur.v;c[id]=c[id]||{o:[null,null,null],i:[null,null,null],a:[null,null,null]};
  c[id][m]=c[id][m]||[null,null,null];c[id][m][i]=x}
function sums(m){const g=G(),b=[0,0,0];let amt=0,n=0;
  g.items.forEach(r=>{const v=vv(r.id,m);if(!v.some(x=>x!==null))return;
    v.forEach((x,i)=>b[i]+=(x||0));const t=v.reduce((a,c)=>a+(c||0),0);amt+=(r.price||0)*t;if(t)n++});
  return{b,T:b[0]+b[1]+b[2],amt,n}}

function getAiAdoption(){
  const g=G();let match=0,total=0;
  g.items.forEach(r=>{
    const vo=vv(r.id,'o'), vi=vv(r.id,'i');
    if(vi.some(x=>x!==null)){
      total++;
      if(vo[0]===vi[0]&&vo[1]===vi[1]&&vo[2]===vi[2]) match++;
    }
  });
  if(!total) return null;
  const rate=Math.round((match/total)*100);
  let label='適正（利益最大ゾーン 70-80%）', cls='ok';
  if(rate>85){label='AI依存過多（利益低下リスク）';cls='crit'}
  else if(rate<65){label='意思入れ強め';cls='warn'}
  return {rate,label,cls,match,total};
}

/* ---------- 公式マニュアル準拠：売筋上位50%傾斜配分 ---------- */
function fix2(v,unit){if((unit||1)<2)return v.slice();v=v.slice();const T=v.reduce((a,b)=>a+b,0);
  if(!v.includes(1))return v;if(T<=1)return[0,0,0];
  const o=[0,1,2].sort((a,b)=>v[b]-v[a]||a-b),k=Math.min(3,Math.floor(T/2)),use=o.slice(0,k);
  const w=use.map(i=>Math.max(v[i],.5)),W=w.reduce((a,b)=>a+b,0),out=[0,0,0];let rem=T;
  use.forEach((i,ix)=>{let q;if(ix===use.length-1)q=rem;
    else{q=Math.max(2,Math.round(T*w[ix]/W));q=Math.min(q,rem-2*(use.length-ix-1))}out[i]=q;rem-=q});
  return out}

function alloc(){
  const g=G();if(!g.items.length){alert('先に商品を登録してください');return}
  applyDow();
  const carry=Number($('carry').value)||0;
  let tq=Number($('tq').value)||0;const ta=Number($('ta').value)||0;
  const live=g.items.filter(r=>(r.day||0)>0);
  if(!live.length){alert('日販が入っている商品がありません');return}
  const W=live.reduce((a,r)=>a+r.day,0);
  if(!tq&&!ta){alert('目標個数か金額を入れてください');return}
  let target=tq||Math.round(ta/(live.reduce((a,r)=>a+r.price*r.day,0)/W));
  if(carry>0)target=Math.max(1,target-carry);

  const sorted=[...live].sort((a,b)=>(b.day||0)-(a.day||0));
  const topCount=Math.max(1,Math.ceil(sorted.length*0.5));
  const topIds=new Set(sorted.slice(0,topCount).map(r=>r.id));

  const base={},q={};
  const W_top=sorted.slice(0,topCount).reduce((a,r)=>a+r.day,0);
  const minBotTotal=sorted.slice(topCount).reduce((a,r)=>a+Math.round(r.day),0);
  const allocTop=Math.max(0,target-minBotTotal);

  live.forEach(r=>{
    if(topIds.has(r.id)){
      base[r.id]=W_top>0?(r.day/W_top*allocTop):r.day;
    }else{
      base[r.id]=Math.max(1,Math.round(r.day));
    }
    q[r.id]=Math.max(r.my||1,Math.round(base[r.id]));
  });

  const S=()=>live.reduce((a,r)=>a+q[r.id],0);
  let gd=0;
  while(S()>target&&gd++<900){
    const k=live.filter(r=>q[r.id]>Math.max(r.my||1,1))
      .sort((a,b)=>(q[b.id]-base[b.id])-(q[a.id]-base[a.id]))[0];if(!k)break;q[k.id]--}
  gd=0;
  while(S()<target&&gd++<900){
    const k=live.slice().sort((a,b)=>(base[b.id]-q[b.id])-(base[a.id]-q[a.id]))[0];q[k.id]++}
  const T=S();

  const gv=(id,d)=>{const v=$(id).value.trim();return v===''?d:Number(v)};
  const R=[gv('r1',59),gv('r2',24),gv('r3',17)],RS=R[0]+R[1]+R[2];
  const p1=R[0]/RS,p2=R[1]/RS,p3=R[2]/RS;
  const n3=p3<=0?0:Math.max(2,Math.round(T*p3/2));
  const top3=n3===0?[]:live.slice().sort((a,b)=>q[b.id]-q[a.id]).filter(r=>q[r.id]>=6).slice(0,n3).map(r=>r.id);
  
  g.items.forEach(r=>{
    if(!(r.id in q)){setAll(r.id,[0,0,0]);return}
    const t3=top3.includes(r.id)?2:0,rest=Math.max(0,q[r.id]-t3);
    const t2=Math.round(rest*(p2/(p1+p2))),t1=rest-t2;
    setAll(r.id,fix2([t1,t2,t3],r.unit))});
  
  MODE='o';setMode('o');paintTotals();autosave();
  const s=sums('o');
  $('allocnote').className='note ok';
  $('allocnote').textContent=`${s.T}個 / ${s.amt.toLocaleString()}円　便別${R.join('/')}%`
    +(carry?`　※今朝の棚${carry}個を引いた数です`:'')
    +(tq?`　個数目標の${Math.round(s.T/tq*100)}%`:'')+(ta?`　金額目標の${Math.round(s.amt/ta*100)}%`:'')}
